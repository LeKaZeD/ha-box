# https://developers.home-assistant.io/docs/apps/configuration
name: HA Box
version: "0.2.0"
slug: ha-box
description: Physical interface for Home Assistant with E-Paper display, sensors and controllers
url: "https://github.com/LeKaZeD/ha-box"
arch:
  - aarch64
init: false
startup: services
#boot: auto
#apparmor: true
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - share:rw
# UART for ESP32 communication (UART0 = Pi communication + bootloader flashing)
devices:
  - /dev/ttyAMA0
  - /dev/serial0
  - /dev/gpiochip0
  - /dev/spidev0.0
ports:
  5557/tcp: 5557
ports_description:
  5557/tcp: RFLink 433MHz RF server
gpio: true
#kernel_modules: false
options:
  # Box / ESP32: language, weather for display, sensors, fan, OTA. Restart the add-on to apply.
  general:
    log_level: "info"
    lang: auto
  weather:
    weather_entity: "weather.forecast_home"
    update_interval: 300
  bme280:
    enabled: true
    address: "auto"
    update_interval: 30
  fan:
    enabled: true
    min_temp: 28
    max_temp: 60
  ota:
    io0_gpio: 23
    en_gpio: 24
    force_flash: false
  daynight:
    update_interval: 60
  clock:
    update_interval: 60
  status:
    update_interval: 30
    exposed_addon_slugs: []
  uart:
    device: "auto"
  connection:
    connected_timeout: 120
    reconnecting_timeout: 60
  rf433:
    enabled: false
    tcp_port: 5557
    spi_bus: 0
    spi_device: 0
    gdo0_pin: 17
    gdo2_pin: 27

schema:
  general:
    log_level: "list(trace|debug|info|warning|error|critical)?"
    lang: "list(auto|fr|en)?"
  weather:
    weather_entity: "str?"
    update_interval: "int(10,300)?"
  bme280:
    enabled: "bool"
    address: "list(auto|0x76|0x77)?"
    update_interval: "int(10,300)?"
  fan:
    enabled: "bool"
    min_temp: "int(0,100)?"
    max_temp: "int(0,100)?"
  ota:
    io0_gpio: "int?"
    en_gpio: "int?"
    force_flash: "bool?"
  daynight:
    update_interval: "int(10,3600)?"
  clock:
    update_interval: "int(10,3600)?"
  status:
    update_interval: "int(10,300)?"
    exposed_addon_slugs:
      - "str"
  uart:
    device: "list(auto|/dev/serial0|/dev/ttyAMA0|/dev/ttyUSB0)?"
  connection:
    connected_timeout: "int(30,600)?"
    reconnecting_timeout: "int(10,300)?"
  rf433:
    enabled: "bool"
    tcp_port: "int(1024,65535)?"
    spi_bus: "int?"
    spi_device: "int?"
    gdo0_pin: "int?"
    gdo2_pin: "int?"

#image: "ghcr.io/lekazed/{arch}-addon-ha-box"
