# https://developers.home-assistant.io/docs/apps/configuration
name: HA Box
version: "0.1.38"
slug: ha-box
description: Physical interface for Home Assistant with E-Paper display, sensors and controllers
url: "https://github.com/LeKaZeD/ha-box"
arch:
  - aarch64
init: false
startup: services
boot: auto
apparmor: true
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - share:rw
# Only UART devices needed for ESP32 communication
# I2C, SPI, GPIO will be added when those features are implemented
devices:
  - /dev/ttyAMA0
  - /dev/serial0
gpio: false
kernel_modules: false
options:
  home_assistant:
    weather_entity: "weather.forecast_home"
    update_interval: 300
  # E-Paper display configuration
  display:
    enabled: true
    rotation: 0
    refresh_mode: "full"
    front_light:
      enabled: true
      brightness: 50
  
  # Sensors configuration
  sensors:
    bme280:
      enabled: true
      address: "auto"
      update_interval: 30
    nfc:
      enabled: true
      address: "0x24"
      polling_interval: 1
    touch:
      enabled: true
  
  # Control devices configuration
  control:
    fan:
      enabled: false
      pin: 18
      auto_control: true
      min_temp: 40
      max_temp: 60
    led:
      enabled: false
      pin: 21
      count: 10

schema:
  home_assistant:
    weather_entity: "str?"
    update_interval: "int(10,300)?"
  display:
    enabled: "bool"
    rotation: "int(0,3)?"
    refresh_mode: "list(full|partial)?"
    front_light:
      enabled: "bool"
      brightness: "int(0,100)?"
  sensors:
    bme280:
      enabled: "bool"
      address: "match(^(auto|0x76|0x77)$)?"
      update_interval: "int(10,300)?"
    nfc:
      enabled: "bool"
      address: "match(^(0x24|0x48)$)?"
      polling_interval: "int(1,10)?"
    touch:
      enabled: "bool"
  control:
    fan:
      enabled: "bool"
      pin: "int(1,40)?"
      auto_control: "bool"
      min_temp: "int(0,100)?"
      max_temp: "int(0,100)?"
    led:
      enabled: "bool"
      pin: "int(1,40)?"
      count: "int(1,100)?"

#image: "ghcr.io/lekazed/{arch}-addon-ha-box"
