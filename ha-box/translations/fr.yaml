configuration:
  general:
    name: Général
    description: Paramètres de langue et de logs.
    fields:
      log_level:
        name: Niveau de logs
        description: Verbosité des logs de l'add-on. Utiliser "trace" pour voir les trames UART brutes, "debug" pour le diagnostic, "info" pour une utilisation normale.
      lang:
        name: Langue
        description: Langue d'affichage. "auto" suit la langue configurée dans Home Assistant.
  weather:
    name: Météo
    description: Source de données météo affichée sur l'écran ESP32.
    fields:
      weather_entity:
        name: Entité météo
        description: Identifiant de l'entité météo Home Assistant (ex. weather.forecast_home).
      update_interval:
        name: Intervalle de mise à jour (s)
        description: Fréquence de rafraîchissement des données météo, en secondes.
  bme280:
    name: Capteur BME280
    description: Capteur de température ambiante, humidité et pression sur l'ESP32.
    fields:
      enabled:
        name: Activer le BME280
        description: Activer ou désactiver le capteur BME280.
      address:
        name: Adresse I2C
        description: Adresse I2C du BME280. Utiliser "auto" pour la détection automatique.
      update_interval:
        name: Intervalle de mise à jour (s)
        description: Fréquence d'envoi des mesures vers Home Assistant, en secondes.
  fan:
    name: Ventilateur
    description: Courbe de température du ventilateur PWM, envoyée à l'ESP32 au démarrage.
    fields:
      enabled:
        name: Activer le ventilateur
        description: Activer ou désactiver le contrôle automatique du ventilateur.
      min_temp:
        name: Température de démarrage (°C)
        description: Température à laquelle le ventilateur commence à tourner.
      max_temp:
        name: Température pleine vitesse (°C)
        description: Température à laquelle le ventilateur atteint sa vitesse maximale.
  ota:
    name: Mise à jour OTA
    description: Broches GPIO utilisées pour entrer en mode bootloader ESP32 et flasher le firmware via UART.
    fields:
      io0_gpio:
        name: Broche GPIO IO0
        description: Numéro de broche BCM du Raspberry Pi connectée à IO0 de l'ESP32.
      en_gpio:
        name: Broche GPIO EN
        description: Numéro de broche BCM du Raspberry Pi connectée à EN (reset) de l'ESP32.
      force_flash:
        name: Forcer le flash
        description: "Flasher le firmware à chaque connexion sans vérifier la version. Utile pour les tests en développement."
  daynight:
    name: Mode Jour / Nuit
    description: Suit automatiquement le lever et coucher du soleil via sun.sun. Déclenche l'événement ha_box_mode_changed à chaque changement de mode pour les automatisations.
    fields:
      update_interval:
        name: Intervalle de mise à jour (s)
        description: Fréquence de lecture de sun.sun pour détecter le lever/coucher du soleil, en secondes.
  clock:
    name: Horloge
    description: Synchronisation de l'heure envoyée du Raspberry Pi vers l'ESP32.
    fields:
      update_interval:
        name: Intervalle de synchronisation (s)
        description: Fréquence d'envoi de l'heure vers l'ESP32, en secondes.
  status:
    name: Statut système
    description: Heartbeat de statut système envoyé aux icônes de l'ESP32.
    fields:
      update_interval:
        name: Intervalle de mise à jour (s)
        description: Fréquence d'envoi du statut système vers l'ESP32, en secondes.
      exposed_addon_slugs:
        name: Slugs d'add-ons exposés
        description: Slugs des add-ons qui activent l'icône "exposé" lorsqu'ils sont actifs (ex. cloudflared, duckdns).
  uart:
    name: Port UART
    description: Port série utilisé pour communiquer avec l'ESP32.
    fields:
      device:
        name: Périphérique
        description: Chemin du port série. Utiliser "auto" pour la détection automatique.
  connection:
    name: Délais de connexion
    description: Délais de la machine d'états de connexion ESP32.
    fields:
      connected_timeout:
        name: Délai connecté (s)
        description: Secondes sans message avant de passer en état "reconnexion".
      reconnecting_timeout:
        name: Délai reconnexion (s)
        description: Secondes sans message avant de passer en état "déconnecté".
  rf433:
    name: Module RF 433 MHz
    description: Module CC1101 pour la réception et l'émission de signaux 433 MHz. Expose un serveur TCP compatible RFLink.
    fields:
      enabled:
        name: Activer le RF 433 MHz
        description: Activer ou désactiver le module CC1101.
      tcp_port:
        name: Port TCP RFLink
        description: Port d'écoute du serveur RFLink compatible (défaut 5557).
      spi_bus:
        name: Bus SPI
        description: Numéro du bus SPI du Raspberry Pi (défaut 0).
      spi_device:
        name: Périphérique SPI
        description: Numéro du périphérique SPI (CE0=0, CE1=1 — défaut 0).
      gdo0_pin:
        name: Broche GDO0
        description: Numéro de broche BCM du Raspberry Pi connectée à GDO0 du CC1101.
      gdo2_pin:
        name: Broche GDO2
        description: Numéro de broche BCM du Raspberry Pi connectée à GDO2 du CC1101.
